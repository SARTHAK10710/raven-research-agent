# Raven uv workspace root.
#
# This file owns the workspace configuration and shared tool settings only.
# It contains no application code. Engine packages are workspace members with
# their own pyproject.toml; one root uv.lock covers the whole workspace.
# See docs/technical-decisions/01-baseline-technology-stack.md section 22.

[tool.uv.workspace]
members = ["memory-engine"]

[tool.uv.sources]
raven-memory-engine = { workspace = true }

[dependency-groups]
# Phase 8.1 development dependencies (7.1 section 22.1). The workspace member
# is listed so that `uv sync` installs it for tests and type checking.
dev = [
    "raven-memory-engine",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

# --------------------------------------------------------------------------
# Ruff
# --------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["memory-engine/src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "S",   # flake8-bandit (security)
    "N",   # pep8-naming
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert is how pytest tests are written

# --------------------------------------------------------------------------
# mypy (strict mode, approved 2026-11-11)
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["memory-engine/src", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
# Tests have several conftest.py files; name modules by their path from the root.
explicit_package_bases = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------
# pytest and coverage (tests live in the repository-root tests/ directory)
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers", "--strict-config"]
markers = [
    "integration: requires real PostgreSQL (docker compose up -d postgres-test); skipped if absent",
]

[tool.coverage.run]
source = ["memory_engine"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

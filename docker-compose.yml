# Raven local infrastructure for DEVELOPMENT AND TESTING ONLY.
#
# Approved in docs/technical-decisions/01-baseline-technology-stack.md section 23.2
# (integration tests against real PostgreSQL with pgvector via Docker Compose).
# Never use this file, or its default credentials, for staging or production.
#
#   docker compose up -d postgres-test
#   uv run pytest -m integration
#
# The password below is a throwaway local default, not a secret. Override it with
# RAVEN_TEST_DB_PASSWORD and pass the same value to the tests via RAVEN_TEST_DATABASE_URL.

services:
  postgres-test:
    image: pgvector/pgvector:pg17
    container_name: raven-postgres-test
    environment:
      POSTGRES_USER: raven_test
      POSTGRES_PASSWORD: ${RAVEN_TEST_DB_PASSWORD:-raven_test_only}
      POSTGRES_DB: raven_memory_test
    ports:
      # Non-default host port so a developer's own PostgreSQL on 5432 is never touched.
      - "127.0.0.1:55432:5432"
    tmpfs:
      # Test data is disposable: nothing persists across container restarts.
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raven_test -d raven_memory_test"]
      interval: 2s
      timeout: 3s
      retries: 30

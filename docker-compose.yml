# Raven local infrastructure for DEVELOPMENT AND TESTING ONLY.
#
# Approved in docs/technical-decisions/01-baseline-technology-stack.md section 23.2
# (integration tests against real PostgreSQL with pgvector via Docker Compose) and
# section 24.1 (SeaweedFS as the S3-compatible object store for tests and development),
# and section 24.3 (RabbitMQ as the test broker for the ingestion handoff).
# Never use this file, or its default credentials, for staging or production.
#
#   docker compose up -d --wait postgres-test object-storage-test broker-test
#   uv run pytest -m integration
#
# The passwords below are throwaway local defaults, not secrets. Override them with
# RAVEN_TEST_DB_PASSWORD / RAVEN_TEST_BROKER_PASSWORD and pass the same values to the
# tests via RAVEN_TEST_DATABASE_URL / RAVEN_TEST_BROKER_URL.
# The object-store keys in docker/seaweedfs/s3.json are likewise test-only values.

services:
  postgres-test:
    image: pgvector/pgvector:pg17
    container_name: raven-postgres-test
    environment:
      POSTGRES_USER: raven_test
      POSTGRES_PASSWORD: ${RAVEN_TEST_DB_PASSWORD:-raven_test_only}
      POSTGRES_DB: raven_memory_test
    ports:
      # Non-default host port so a developer's own PostgreSQL on 5432 is never touched.
      - "127.0.0.1:55432:5432"
    tmpfs:
      # Test data is disposable: nothing persists across container restarts.
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raven_test -d raven_memory_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  object-storage-test:
    # SeaweedFS (Apache-2.0), pinned; licence and version checked 2026-11-11 (7.1 section 24.1).
    image: chrislusf/seaweedfs:4.51
    container_name: raven-object-storage-test
    # One container runs master, volume, filer and the S3 gateway. Small volumes keep
    # the in-memory test store light.
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
      - -master.volumeSizeLimitMB=64
    ports:
      # Non-default host port so nothing else on 8333 is touched.
      - "127.0.0.1:58333:8333"
    volumes:
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    tmpfs:
      # Test data is disposable: nothing persists across container restarts.
      - /data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  broker-test:
    # RabbitMQ (MPL-2.0), official image, pinned; licence and version checked 2026-11-12
    # (7.1 section 24.3). No management plugin.
    image: rabbitmq:4.3.7-alpine
    container_name: raven-broker-test
    hostname: raven-broker-test
    environment:
      RABBITMQ_DEFAULT_USER: raven_test
      RABBITMQ_DEFAULT_PASS: ${RAVEN_TEST_BROKER_PASSWORD:-raven_test_only}
      RABBITMQ_DEFAULT_VHOST: raven_test
    ports:
      # Non-default host port so a developer's own broker on 5672 is never touched.
      - "127.0.0.1:55672:5672"
    tmpfs:
      # Test messages are disposable: nothing persists across container restarts.
      - /var/lib/rabbitmq:uid=100,gid=101,mode=0750
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 3s
      timeout: 10s
      retries: 40

# Alembic configuration for the Memory Engine schema (Phase 8.2).
#
# Run from the repository root:
#   uv run alembic -c memory-engine/alembic.ini upgrade head
#
# The database URL is NOT stored here. migrations/env.py builds it from the
# validated RAVEN_MEMORY__ settings (memory_engine.config), so no credential
# ever appears in this file. Use a dedicated migration role (7.2 section 3).

[alembic]
script_location = %(here)s/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

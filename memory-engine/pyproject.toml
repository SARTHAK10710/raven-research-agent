[project]
name = "raven-memory-engine"
version = "0.1.0"
description = "Raven Memory Engine: Personal Memory and Document Intelligence."
readme = "README.md"
requires-python = ">=3.12"
# Runtime dependencies (docs/technical-decisions/01-baseline-technology-stack.md sections 22.1
# and 23.2): Phase 8.1 pydantic and pydantic-settings; Phase 8.2 SQLAlchemy 2.x (synchronous),
# Alembic and psycopg 3. psycopg is LGPL-3.0, to be reviewed before production (23.2).
# Phase 8.3: boto3 (Apache-2.0), the S3 client approved in section 24.1 (Decision 8); celery and
# kombu (BSD-3-Clause), the approved worker framework and its messaging library (7.4 section 21;
# section 24.3), added in step 4 for the outbox relay. kombu is declared because tests use it.
# Phase 8.4 step 2: spaCy 3.8 (MIT) with the en_core_web_sm 3.8.0 model (MIT), the conventional
# NLP stack approved in section 25.3 (Decision 14); the model is a pinned wheel (see tool.uv.sources).
dependencies = [
    "alembic>=1.13,<2",
    "boto3>=1.40,<2",
    "celery>=5.7,<6",
    "en-core-web-sm",
    "kombu>=5.7,<6",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "spacy>=3.8,<3.9",
    "sqlalchemy>=2.0,<3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_engine"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[project]
name = "raven-memory-engine"
version = "0.1.0"
description = "Raven Memory Engine: Personal Memory and Document Intelligence."
readme = "README.md"
requires-python = ">=3.12"
# Phase 8.1 runtime dependencies only (docs/technical-decisions/01-baseline-technology-stack.md
# section 22.1). SQLAlchemy, Alembic and the PostgreSQL driver arrive in Phase 8.2.
dependencies = [
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_engine"]
